# scenario-hils configuration (autoware_carla_scenario, docs/hils.md) for
# Autoware as the ECU: launch/autoware_hils.launch.xml on this PC.
#
#   scenario-hils scenario-hils.yaml              (resident)
#   uv run scenario ego.entity=hils hils.host=<this PC> ...
#
# Needs vcan0: `scenario-hils scenario-hils.yaml --setup` creates it, or
#   sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0

carla: {host: localhost, port: 2000, timeout: 10.0}
ego: {role_name: Ego, wait: 120.0}
runner: {listen: "0.0.0.0:7700"}
# Autoware's control_cmd is a target speed, acceleration and tire angle:
# CARLA's Ackermann control applies it as it is.
commands: {mode: ackermann}
# Autoware runs on its own (wall) clock, as an ECU does.
clock: wall

devices:
  vehicle_can:
    url: can://vcan0
    codec: dbc:carla_autoware.dbc
    messages:
      - name: VehicleStatus
        period: 0.01
        fields: {Speed: $longitudinal_velocity, Steer: $steer, Gear: $gear,
                 Reverse: $reverse, HandBrake: $hand_brake, YawRate: $yaw_rate_rad}
      # On while a scenario runs; scenario_end sends it off.
      - name: PowerMode
        period: 0.1
        fields: {Ignition: 1}
    inputs:
      - name: ControlCmd
        command:
          speed: {field: TargetSpeed}
          acceleration: {field: Accel}
          steer: {field: SteerAngle, scale: -1.0}   # left-positive -> CARLA's right
          jerk: {field: Jerk}

  # A Tamagawa Seiki IMU on the CAN, in its own frame and format, which
  # Autoware's tamagawa_imu_driver (tag_can_driver) decodes, as on a car. The
  # AWSIM sensor kit mounts tamagawa/imu_link turned 180 deg about x and z
  # (= 180 deg about y), so the IMU's x and z are the vehicle's -x and -z.
  # (The sensor kit's own ~0.9 deg pitch and ~2 deg yaw are left out.)
  # Roll and pitch rates matter: the EKF turns NDT's roll/pitch forward over
  # the scan's delay with them; without them NDT's initial guess lags the
  # body's pitching by that delay and NDT oscillates.
  imu_can:
    url: can://vcan0
    codec: dbc:tamagawa_imu.dbc
    messages:
      - name: TAG_Gyro
        period: 0.01
        fields:
          Counter: 0
          GyroX: {signal: roll_rate, scale: -1.0}
          GyroY: $pitch_rate
          GyroZ: {signal: yaw_rate, scale: -1.0}
      # tag_can_driver publishes on this one, with the latest TAG_Gyro.
      - name: TAG_Accel
        period: 0.01
        fields:
          Counter: 0
          AccelX: {signal: longitudinal_acceleration, scale: -1.0}
          AccelY: $lateral_acceleration
          # Specific force: +g up at rest, which is the IMU's -z.
          AccelZ: {signal: vertical_acceleration, scale: -1.0, offset: -9.80665}

  # A Septentrio GNSS receiver streaming SBF on TCP, which Autoware's
  # septentrio_gnss_driver reads (config/hils/septentrio_gnss.param.yaml): its
  # NavSatFix needs PVTGeodetic and PosCovGeodetic of the same epoch, which
  # the `epoch` option gives them. Latitude/longitude are CARLA's geolocation
  # (the level's OpenDRIVE tmerc), so Autoware needs the map from
  # `hils_geo_map` (TransverseMercator at 0/0). They are the vehicle origin's,
  # not an antenna's: Autoware gets them as gnss_link's and initializes from
  # them with an NDT search, as from a single-antenna receiver.
  gnss:
    url: tcp://127.0.0.1:28784?listen
    codec: sbf
    options: {epoch: 0.1}
    messages:
      # latency: the block goes out at its epoch. Left out it is Do-Not-Use
      # (65535 x 0.1 ms), which septentrio_gnss_driver's latency_compensation
      # takes for 6.55 s and back-dates the NavSatFix past pose_initializer's
      # gnss_pose_timeout.
      - name: PVTGeodetic
        period: 0.1
        fields: {mode: 4, latitude: $latitude_rad, longitude: $longitude_rad,
                 height: $altitude, undulation: 0.0, vn: $velocity_north,
                 ve: $velocity_east, vu: $velocity_up, nr_sv: 14, latency: 0}
      # RTK fixed: 2 cm horizontal, 3 cm vertical (m^2).
      - name: PosCovGeodetic
        period: 0.1
        fields: {mode: 4, cov_latlat: 0.0004, cov_lonlon: 0.0004, cov_hgthgt: 0.0009}

  # A Hesai Pandar XT32 where the AWSIM sensor kit has velodyne_top
  # (base_link -> sensor_kit_base_link -> velodyne_top, in CARLA's vehicle frame).
  # 32 channels at 1 deg (twice the VLP-16's): NDT on the VLP-16's ~700
  # downsampled points oscillated in local minima and its WARN dropped Autoware
  # into MRMs. A Hesai's own frame has y forward (nebula keeps it), so the
  # CARLA sensor is turned so that its x is velodyne_top's y: velodyne_top's
  # (roll 0.8597, pitch -0.0537, yaw -88.1561) composed with a 90 deg yaw.
  lidar_top:
    url: udp://127.0.0.1:2368
    codec: lidar:pandar_xt32
    sensor:
      blueprint: sensor.lidar.ray_cast
      transform: {x: -0.49707, y: 0.0, z: 2.0, roll: 0.0537, pitch: 0.8597, yaw: -178.1553}
      attributes:
        channels: 32
        range: 120
        upper_fov: 15
        lower_fov: -16
        points_per_second: 640000
        rotation_frequency: 10
        dropoff_general_rate: 0.0
        dropoff_zero_intensity: 0.0
      intensity_scale: 255

lifecycle:
  startup:
    - send: vehicle_can
      name: PowerMode
      fields: {Ignition: 0}
  scenario_start:
    # Autoware is awake (its AD API is up). The LiDAR streams after this.
    - wait: vehicle_can
      name: EcuStatus
      fields: {Ready: 1}
      timeout: 170.0
  warmup:
    # With the LiDAR streaming, Autoware initializes localization, sets the
    # route and engages; the run holds the ego still until it drives, and its
    # clock starts then (needs autoware_carla_scenario with the warmup phase).
    # The run's hils.ready_timeout_s covers this and scenario_start together.
    - wait: vehicle_can
      name: EcuStatus
      fields: {Engaged: 1}
      timeout: 120.0
  scenario_end:
    - send: vehicle_can
      name: PowerMode
      fields: {Ignition: 0}
    - sleep: 1.0
  shutdown: []
